[package]
name = "tf2-frag-helper"
version = "34.0.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
hex = "0.4"
parking_lot = "0.12"
rayon = "1.11"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slint = { version = "=1.16.0", features = ["unstable-winit-030"] }
sysinfo = "=0.37.1"
# Slint 1.16 accepts newer releases of these transitive crates, but those
# releases raised their MSRV above the Rust 1.88 toolchain this project supports.
smol_str = "=0.3.2"
typed-index-collections = "=3.3.0"
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tf2-mirv-director = { path = "../director" }

[build-dependencies]
slint-build = "=1.16.0"

[package]
name = "tf2-frag-helper"
version = "34.0.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
hex = "0.4"
parking_lot = "0.12"
rayon = "1.11"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slint = "1.16.0"
sysinfo = "0.39.6"
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.16.0"


[package]
name = "tf2-mirv-director"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "tf2_mirv_director"
path = "src/lib.rs"

[[bin]]
name = "tf2-mirv-director"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
rfd = "0.15"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.16.0", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "=1.16.0"

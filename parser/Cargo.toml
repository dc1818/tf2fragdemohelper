[package]
name = "tf-demo-parser"
description = "parser for tf2 demo files"
version = "0.7.0"
authors = ["Robin Appelman <robin@icewind.nl>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/demostf/parser"
exclude = ["tests/fuzz", "test_data"]
rust-version = "1.75.0"

[lib]
name = "tf_demo_parser"
path = "src/lib.rs"

[[bin]]
name = "export_all"
path = "src/bin/export_all.rs"

[dependencies]
bitbuffer = { version = "0.11.3", features = ["serde"] }
num_enum = "0.7.2"
num-traits = "0.2.19"
enumflags2 = { version = "0.7.10", features = ["serde"] }
snap = "1.1.1"
serde = { version = "1.0.203", features = ["derive", "rc"] }
serde_json = "1.0.117"
serde_repr = "0.1.19"
thiserror = "2.0.4"
parse-display = "0.9.1"
main_error = "0.1.2"
fnv = "1.0.7"
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"], optional = true }
itertools = "0.14.0"
const-fnv1a-hash = "1.1.0"
schemars = { version = "1.0.4", optional = true }

log = { version = "0.4.21", features = [] }

[features]
codegen = []
schema = ["schemars", "bitbuffer/schemars_1"]
trace = ["tracing", "tracing-subscriber"]
write = []

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 2

